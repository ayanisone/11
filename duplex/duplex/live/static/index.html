<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duplex live · Riff</title>
<style>
  :root { color-scheme: dark; --bg:#111214; --panel:#1a1c20; --line:#2a2d33; --dim:#8a8f98; --fg:#e7e9ee; --user:#9ecbff; --agent:#ffd28a; --ok:#7ee0a1; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0 8px 0 0; font-weight:600; }
  button { background:#2b5cff; color:#fff; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
  button.stop { background:#c0392b; }
  #status { color:var(--dim); }
  #meter { width:120px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  #meter > div { height:100%; width:0; background:var(--ok); transition:width 60ms linear; }
  main { display:grid; grid-template-columns: 1fr 340px; height: calc(100vh - 53px); }
  #convo { overflow-y:auto; padding:16px; }
  .turn { margin:0 0 10px; max-width:720px; }
  .turn .who { font-size:12px; color:var(--dim); margin-right:6px; }
  .user { color:var(--user); } .agent { color:var(--agent); }
  .live { opacity:.65; }
  .mark { font-size:12px; color:var(--dim); font-style:italic; margin:0 4px; }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:12px; overflow-y:auto; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:14px 0 6px; }
  .knob { display:grid; grid-template-columns: 1fr 52px; gap:4px 8px; align-items:center; margin:4px 0; font-size:13px; }
  .knob input[type=range] { grid-column: 1 / 3; width:100%; }
  .stats { display:grid; grid-template-columns: 1fr auto; gap:2px 8px; font-size:13px; }
  .stats span:nth-child(even) { text-align:right; font-variant-numeric: tabular-nums; }
  #verdict { font-size:13px; color:var(--dim); min-height:18px; }
  #log { font:12px/1.4 ui-monospace, Menlo, monospace; color:var(--dim); white-space:pre-wrap; }
  .hint { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>duplex live</h1>
  <button id="go">Start</button>
  <div id="meter" title="mic level / voice detected"><div></div></div>
  <span id="status">headphones on, then Start</span>
</header>
<main>
  <section id="convo"></section>
  <aside>
    <h2>Listener (Claude)</h2>
    <div id="verdict">–</div>
    <h2>Timing</h2>
    <div class="stats">
      <span>last gap</span><span id="s-gap">–</span>
      <span>median gap</span><span id="s-med">–</span>
      <span>overlapping starts</span><span id="s-ov">0</span>
      <span>backchannels</span><span id="s-bc">0</span>
      <span>sentence finishes</span><span id="s-cmp">0</span>
    </div>
    <h2>Knobs</h2>
    <div id="knobs"></div>
    <p class="hint">Gaps are measured from the end of your speech to the agent's first audible sample.
      Human conversation sits around 0–200&nbsp;ms.</p>
    <h2>Log</h2>
    <div id="log"></div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const MIC_RATE = 16000, TTS_RATE = 24000;
let ws = null, ctx = null, stream = null, micNode = null, replyGain = null, bcGain = null;
let bank = {}, running = false;
const active = new Map();   // reply id -> {sources, endAt, final, started}
const dead = new Set();
const gaps = []; let nOverlap = 0, nBc = 0, nCmp = 0;

// ---------------------------------------------------------------- knobs (server floor + local VAD)
const KNOBS = [
  ["bc_min_gap", "seconds between backchannels", 1, 10, 0.5],
  ["bc_min_words", "words before a backchannel", 1, 15, 1],
  ["eot_unsure", "wait when you're mid-thought (s)", 0.4, 2.5, 0.05],
  ["eot_done", "wait when you're done (s)", 0.05, 1.0, 0.05],
  ["barge_min", "talk-over before it yields (s)", 0.1, 1.2, 0.05],
  ["overlap_start", "start before you finish", 0, 1, 1],
];
const LOCAL = { vadDb: 14, duckDb: 8 };
function buildKnobs(params) {
  const box = $("#knobs"); box.innerHTML = "";
  for (const [k, label, min, max, step] of KNOBS) {
    const v = typeof params[k] === "boolean" ? (params[k] ? 1 : 0) : params[k];
    box.insertAdjacentHTML("beforeend", `<div class="knob"><label>${label}</label><span id="v-${k}">${v}</span>
      <input type="range" id="k-${k}" min="${min}" max="${max}" step="${step}" value="${v}"></div>`);
    $("#k-" + k).oninput = e => {
      const val = parseFloat(e.target.value); $("#v-" + k).textContent = val;
      send({ type: "params", [k]: k === "overlap_start" ? val >= 1 : val });
    };
  }
  for (const [k, label, min, max] of [["vadDb", "mic sensitivity (dB over noise)", 6, 30], ["duckDb", "duck mic while agent talks (dB)", 0, 20]]) {
    box.insertAdjacentHTML("beforeend", `<div class="knob"><label>${label}</label><span id="v-${k}">${LOCAL[k]}</span>
      <input type="range" id="k-${k}" min="${min}" max="${max}" step="1" value="${LOCAL[k]}"></div>`);
    $("#k-" + k).oninput = e => { LOCAL[k] = +e.target.value; $("#v-" + k).textContent = LOCAL[k]; };
  }
}

// ---------------------------------------------------------------- transcript view
let userLive = null, agentLine = new Map();
function userTurn(text, final) {
  if (!text) return;
  if (!userLive) {
    userLive = document.createElement("p"); userLive.className = "turn user live";
    userLive.innerHTML = '<span class="who">you</span><span class="t"></span>';
    $("#convo").appendChild(userLive);
  }
  userLive.querySelector(".t").textContent = text;
  userLive.classList.toggle("live", !final);
  scroll();
}
function mark(text) {
  const host = userLive || $("#convo").lastElementChild || $("#convo");
  host.insertAdjacentHTML("beforeend", `<span class="mark">· ${text} ·</span>`); scroll();
}
function agentText(id, text) {
  let p = agentLine.get(id);
  if (!p) {
    userLive = null;
    p = document.createElement("p"); p.className = "turn agent";
    p.innerHTML = '<span class="who">riff</span><span class="t"></span>';
    $("#convo").appendChild(p); agentLine.set(id, p);
  }
  const spoken = text.replace(/\[[^\]]*\]\s*/g, "");  // tags are delivery notes, not words
  const t = p.querySelector(".t"); t.textContent = (t.textContent + " " + spoken).trim(); scroll();
}
function scroll() { const c = $("#convo"); c.scrollTop = c.scrollHeight; }
function log(t, text) { const l = $("#log"); l.textContent = `${t.toFixed(2).padStart(7)}  ${text}\n` + l.textContent.slice(0, 6000); }
function stats() {
  const s = [...gaps].sort((a, b) => a - b);
  $("#s-med").textContent = s.length ? `${s[Math.floor(s.length / 2)]} ms` : "–";
  $("#s-ov").textContent = nOverlap; $("#s-bc").textContent = nBc; $("#s-cmp").textContent = nCmp;
}

// ---------------------------------------------------------------- server messages
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function onJson(m) {
  switch (m.type) {
    case "hello": buildKnobs(m.params); break;
    case "log": log(m.t, m.text); break;
    case "user": userTurn(m.text, m.final); break;
    case "verdict":
      $("#verdict").textContent = `${m.state} · ~${m.remaining} words left` + (m.backchannel !== "none" ? ` · would say "${m.backchannel}"` : "")
        + (m.laugh ? " · funny" : "") + (m.completion ? ` · could finish: "${m.completion}"` : "");
      break;
    case "bc": playBank(m.id); nBc++; mark(m.id); stats(); break;
    case "agent":
      if (m.completion) { nCmp++; mark("finishes: " + m.text); stats(); } else agentText(m.reply_id, m.text);
      break;
    case "reply_end": { const a = active.get(m.reply_id); if (a) a.final = true; break; }
    case "stop": stopReply(m.reply_id); mark("cut off"); break;
    case "gap":
      if (m.gap_ms === null) { nOverlap++; $("#s-gap").textContent = "overlap"; }
      else { gaps.push(m.gap_ms); $("#s-gap").textContent = `${m.gap_ms} ms`; }
      stats(); break;
  }
}

// ---------------------------------------------------------------- playback
function onAudio(buf) {
  const id = new DataView(buf).getUint32(0, true);
  if (dead.has(id)) return;
  const pcm = new Int16Array(buf, 4);
  const ab = ctx.createBuffer(1, pcm.length, TTS_RATE), ch = ab.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  let a = active.get(id);
  if (!a) { a = { sources: [], endAt: 0, final: false, started: false }; active.set(id, a); }
  const at = Math.max(ctx.currentTime + 0.03, a.endAt);
  const src = ctx.createBufferSource(); src.buffer = ab; src.connect(replyGain); src.start(at);
  a.sources.push(src); a.endAt = at + ab.duration;
  if (!a.started) { a.started = true; send({ type: "playback", state: "playing", reply_id: id, delay_ms: Math.round((at - ctx.currentTime) * 1000) }); }
}
function stopReply(id) {
  const a = active.get(id); dead.add(id);
  if (!a) return;
  for (const s of a.sources) { try { s.stop(); } catch (e) {} }
  active.delete(id);
  send({ type: "playback", state: "idle", reply_id: id });
}
setInterval(() => {
  if (!ctx) return;
  for (const [id, a] of active) if (a.final && ctx.currentTime >= a.endAt) { active.delete(id); send({ type: "playback", state: "idle", reply_id: id }); }
}, 30);
function agentAudible() { for (const a of active.values()) if (ctx.currentTime < a.endAt) return true; return false; }
function playBank(id) {
  const takes = bank[id]; if (!takes || !takes.length) return;
  const src = ctx.createBufferSource(); src.buffer = takes[Math.floor(Math.random() * takes.length)];
  src.connect(bcGain); src.start();
}
async function loadBank() {
  const r = await fetch("/bank/manifest.json"); if (!r.ok) return;
  const m = await r.json();
  for (const [id, files] of Object.entries(m.items || {})) {
    bank[id] = await Promise.all(files.map(async f => ctx.decodeAudioData(await (await fetch("/bank/" + f.file)).arrayBuffer())));
  }
}

// ---------------------------------------------------------------- mic: resample to 16 kHz + VAD
let acc = 0, accN = 0, pos = 0; const out16 = new Int16Array(1600); let outN = 0;
function pushMic(block) {
  if (!ctx) return;
  vad(block);
  const step = ctx.sampleRate / MIC_RATE;
  for (let k = 0; k < block.length; k++) {
    acc += block[k]; accN++; pos += 1;
    if (pos >= step) {
      pos -= step;
      out16[outN++] = Math.max(-32768, Math.min(32767, Math.round(acc / accN * 32767)));
      acc = 0; accN = 0;
      if (outN === out16.length) { if (ws && ws.readyState === 1) ws.send(out16.buffer.slice(0)); outN = 0; }
    }
  }
}
let fE = 0, fN = 0, noise = -60, on = false, above = 0, below = 0;
function vad(block) {
  const frame = ctx.sampleRate * 0.02;
  for (let i = 0; i < block.length; i++) {
    fE += block[i] * block[i];
    if (++fN >= frame) { vadFrame(10 * Math.log10(fE / fN + 1e-12)); fE = 0; fN = 0; }
  }
}
function vadFrame(db) {
  if (!on) noise = db < noise ? db : Math.min(noise + 0.02, db);   // follows the floor down fast, up slowly
  const duck = agentAudible() ? LOCAL.duckDb : 0;                   // sidechain-duck the mic while the agent talks
  const thrOn = Math.max(noise + LOCAL.vadDb, -55) + duck, thrOff = thrOn - 4;
  $("#meter > div").style.width = Math.max(0, Math.min(100, (db + 70) * 1.6)) + "%";
  $("#meter > div").style.background = on ? "var(--ok)" : "#556";
  if (!on) {
    above = db > thrOn ? above + 1 : 0;
    if (above >= 2) { on = true; below = 0; send({ type: "vad", speaking: true, lag_ms: 40 }); }
  } else {
    below = db < thrOff ? below + 1 : 0;
    if (below >= 6) { on = false; above = 0; send({ type: "vad", speaking: false, lag_ms: 120 }); }
  }
}

// ---------------------------------------------------------------- start / stop
const TAP = `class Tap extends AudioWorkletProcessor { process(i) { const c = i[0] && i[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; } } registerProcessor("tap", Tap);`;
async function start() {
  ctx = new AudioContext();
  replyGain = ctx.createGain(); replyGain.connect(ctx.destination);
  bcGain = ctx.createGain(); bcGain.gain.value = 0.55; bcGain.connect(ctx.destination);
  $("#status").textContent = "loading backchannels…";
  await loadBank();
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([TAP], { type: "application/javascript" })));
  const srcNode = ctx.createMediaStreamSource(stream);
  micNode = new AudioWorkletNode(ctx, "tap");
  micNode.port.onmessage = e => pushMic(e.data);
  srcNode.connect(micNode);
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = e => typeof e.data === "string" ? onJson(JSON.parse(e.data)) : onAudio(e.data);
  ws.onclose = () => { $("#status").textContent = "disconnected"; stop(); };
  ws.onopen = () => { $("#status").textContent = "listening — just talk"; };
  running = true; $("#go").textContent = "Stop"; $("#go").className = "stop";
}
function stop() {
  running = false; $("#go").textContent = "Start"; $("#go").className = "";
  if (ws && ws.readyState <= 1) ws.close();
  if (micNode) { micNode.port.onmessage = null; micNode.disconnect(); micNode = null; }
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  ws = null; stream = null; ctx = null; active.clear();
}
$("#go").onclick = () => running ? stop() : start().catch(e => { $("#status").textContent = "error: " + e.message; console.error(e); });
window.duplex = { get ws() { return ws; }, active, bank };  // for tests
</script>
</body>
</html>
