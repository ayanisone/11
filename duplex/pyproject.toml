[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex"
version = "0.1.0"
description = "Natural, overlapping two-person dialogue for ads: Claude writes an overlap score, ElevenLabs voices it, a timeline engine lays it out as stems."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "numpy>=1.26",
    "pydantic>=2",
    "requests>=2.31",
]

[project.optional-dependencies]
live = ["aiohttp>=3.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiohttp>=3.9"]

[project.scripts]
duplex = "duplex.cli:main"
duplex-live = "duplex.live.server:main"

[tool.setuptools.packages.find]
include = ["duplex*"]

[tool.setuptools.package-data]
"duplex.live" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
