[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex"
version = "0.1.0"
description = "Natural, overlapping two-person dialogue for ads: Claude writes an overlap score, ElevenLabs voices it, a timeline engine lays it out as stems."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "numpy>=1.26",
    "pydantic>=2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
duplex = "duplex.cli:main"

[tool.setuptools.packages.find]
include = ["duplex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
