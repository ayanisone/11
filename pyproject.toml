[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bn-dub"
version = "0.1.0"
description = "Bengali dubbing chain built from ElevenLabs Scribe + TTS and Claude, with a Gradio console."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0,<2",
    "elevenlabs>=2.0,<3",
    "gradio>=5,<7",
    "numpy>=1.26",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bn-dub = "bn_dub.cli:main"

[tool.setuptools.packages.find]
include = ["bn_dub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
